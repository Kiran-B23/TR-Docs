<svg viewBox="0 0 780 150" width="100%" style="max-width:780px;height:auto;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Read path: new query, search memories, rank, inject">
  <title>The read path</title>
  <defs><marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
    <path d="M0,0 L7,3.2 L0,6.4 z" fill="#94a3b8"/></marker></defs>
  <text x="390" y="24" text-anchor="middle" font-size="13" fill="#64748b">How a memory comes back</text>
  <rect x="20" y="46" width="155" height="52" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="97" y="77" text-anchor="middle" font-size="13.5" font-weight="600" fill="#3730a3">New query</text>
  <text x="97" y="120" text-anchor="middle" font-size="11.5" fill="#64748b">the user asks</text>
  <text x="97" y="135" text-anchor="middle" font-size="11.5" fill="#64748b">something</text>
  <rect x="215" y="46" width="155" height="52" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="292" y="77" text-anchor="middle" font-size="13.5" font-weight="600" fill="#3730a3">Search memories</text>
  <text x="292" y="120" text-anchor="middle" font-size="11.5" fill="#64748b">filter, or query</text>
  <text x="292" y="135" text-anchor="middle" font-size="11.5" fill="#64748b">by meaning</text>
  <rect x="410" y="46" width="155" height="52" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="487" y="77" text-anchor="middle" font-size="13.5" font-weight="600" fill="#3730a3">Rank</text>
  <text x="487" y="120" text-anchor="middle" font-size="11.5" fill="#64748b">relevance + recency</text>
  <text x="487" y="135" text-anchor="middle" font-size="11.5" fill="#64748b">+ importance</text>
  <rect x="605" y="46" width="155" height="52" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="682" y="77" text-anchor="middle" font-size="13.5" font-weight="600" fill="#3730a3">Inject</text>
  <text x="682" y="120" text-anchor="middle" font-size="11.5" fill="#64748b">the top few become</text>
  <text x="682" y="135" text-anchor="middle" font-size="11.5" fill="#64748b">text in the prompt</text>
  <line x1="179" y1="72" x2="211" y2="72" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar3)"/>
  <line x1="374" y1="72" x2="406" y2="72" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar3)"/>
  <line x1="569" y1="72" x2="601" y2="72" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar3)"/>
</svg>