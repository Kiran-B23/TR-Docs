<svg viewBox="0 0 800 372" width="100%" style="max-width:800px;height:auto;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Four JSON-RPC exchanges between an MCP client and server: initialize returns the protocol version and server info, tools slash list returns the schemas, tools slash call returns content and structured content, and resources slash read returns a contents envelope">
  <title>What travels between client and server</title>
  <defs>
    <marker id="mr" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#6366f1"/></marker>
    <marker id="ml" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#10b981"/></marker>
  </defs>

  <rect x="20" y="20" width="150" height="42" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="95" y="46" text-anchor="middle" font-size="13.5" font-weight="600" fill="#334155">MCP Client</text>

  <rect x="630" y="20" width="150" height="42" rx="9" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="705" y="46" text-anchor="middle" font-size="13.5" font-weight="600" fill="#3730a3">your server.py</text>

  <line x1="95" y1="66" x2="95" y2="344" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="705" y1="66" x2="705" y2="344" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/>

  <!-- 1 initialize -->
  <line x1="100" y1="94" x2="698" y2="94" stroke="#6366f1" stroke-width="1.7" marker-end="url(#mr)"/>
  <rect x="300" y="80" width="82" height="17" fill="#ffffff"/>
  <text x="341" y="92" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4f46e5">initialize</text>
  <line x1="700" y1="122" x2="102" y2="122" stroke="#10b981" stroke-width="1.7" marker-end="url(#ml)"/>
  <rect x="232" y="108" width="290" height="17" fill="#ffffff"/>
  <text x="377" y="120" text-anchor="middle" font-size="11" fill="#047857">protocolVersion: 2026-07-28 · serverInfo: skillmap 1.0.0</text>

  <!-- 2 tools/list -->
  <line x1="100" y1="164" x2="698" y2="164" stroke="#6366f1" stroke-width="1.7" marker-end="url(#mr)"/>
  <rect x="296" y="150" width="90" height="17" fill="#ffffff"/>
  <text x="341" y="162" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4f46e5">tools/list</text>
  <line x1="700" y1="192" x2="102" y2="192" stroke="#10b981" stroke-width="1.7" marker-end="url(#ml)"/>
  <rect x="250" y="178" width="256" height="17" fill="#ffffff"/>
  <text x="378" y="190" text-anchor="middle" font-size="11" fill="#047857">name · description · inputSchema · outputSchema</text>
  <text x="378" y="207" text-anchor="middle" font-size="10.5" fill="#94a3b8">built from your type hints and docstring</text>

  <!-- 3 tools/call -->
  <line x1="100" y1="240" x2="698" y2="240" stroke="#6366f1" stroke-width="1.7" marker-end="url(#mr)"/>
  <rect x="256" y="226" width="170" height="17" fill="#ffffff"/>
  <text x="341" y="238" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4f46e5">tools/call { name, arguments }</text>
  <line x1="700" y1="268" x2="102" y2="268" stroke="#10b981" stroke-width="1.7" marker-end="url(#ml)"/>
  <rect x="262" y="254" width="232" height="17" fill="#ffffff"/>
  <text x="378" y="266" text-anchor="middle" font-size="11" fill="#047857">content · structuredContent · isError</text>

  <!-- 4 resources/read -->
  <line x1="100" y1="310" x2="698" y2="310" stroke="#6366f1" stroke-width="1.7" marker-end="url(#mr)"/>
  <rect x="272" y="296" width="138" height="17" fill="#ffffff"/>
  <text x="341" y="308" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4f46e5">resources/read { uri }</text>
  <line x1="700" y1="338" x2="102" y2="338" stroke="#10b981" stroke-width="1.7" marker-end="url(#ml)"/>
  <rect x="268" y="324" width="220" height="17" fill="#ffffff"/>
  <text x="378" y="336" text-anchor="middle" font-size="11" fill="#047857">contents: [ { uri, mimeType, text } ]</text>

  <text x="400" y="366" text-anchor="middle" font-size="11.5" fill="#64748b">Every Inspector <tspan font-family="ui-monospace,SFMono-Regular,Menlo,monospace">--method</tspan> is one of these message names.</text>
</svg>
