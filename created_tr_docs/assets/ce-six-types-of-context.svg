<svg viewBox="0 0 800 400" width="100%" style="max-width:800px;height:auto;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="One context window divided into six competing types: instructions, examples and tool descriptions are small and always present; knowledge, memory and tool results are large and grow during the task">
  <title>Six types of context, one window</title>
  <defs>
    <marker id="cearr" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#94a3b8"/></marker>
  </defs>

  <text x="400" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Six types of context — one window, shared</text>

  <rect x="40" y="44" width="470" height="300" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="275" y="66" text-anchor="middle" font-size="12" font-weight="600" fill="#4f46e5">the context window</text>

  <rect x="60" y="78" width="430" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="72" y="98" font-size="12" font-weight="600" fill="#334155">Instructions</text>
  <text x="478" y="98" text-anchor="end" font-size="11" fill="#64748b">small · always there</text>

  <rect x="60" y="114" width="430" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="72" y="134" font-size="12" font-weight="600" fill="#334155">Examples</text>
  <text x="478" y="134" text-anchor="end" font-size="11" fill="#64748b">small · always there</text>

  <rect x="60" y="150" width="430" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="72" y="170" font-size="12" font-weight="600" fill="#92400e">Tools</text>
  <text x="478" y="170" text-anchor="end" font-size="11" fill="#a16207">fixed · easy to forget</text>

  <rect x="60" y="186" width="430" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.3"/>
  <text x="72" y="206" font-size="12" font-weight="600" fill="#3730a3">Knowledge</text>
  <text x="72" y="222" font-size="11" fill="#4f46e5">retrieved documents, task data</text>
  <text x="478" y="213" text-anchor="end" font-size="11" fill="#4f46e5">large · varies per turn</text>

  <rect x="60" y="236" width="430" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.3"/>
  <text x="72" y="256" font-size="12" font-weight="600" fill="#3730a3">Memory</text>
  <text x="72" y="272" font-size="11" fill="#4f46e5">conversation state, user facts</text>
  <text x="478" y="263" text-anchor="end" font-size="11" fill="#4f46e5">grows over time</text>

  <rect x="60" y="286" width="430" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="72" y="306" font-size="12" font-weight="700" fill="#991b1b">Tool results</text>
  <text x="72" y="322" font-size="11" fill="#b91c1c">whatever the tool decided to return</text>
  <text x="478" y="313" text-anchor="end" font-size="11" font-weight="600" fill="#b91c1c">large · unpredictable</text>

  <line x1="516" y1="308" x2="566" y2="308" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#cearr)"/>
  <rect x="572" y="270" width="196" height="76" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
  <text x="670" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">The usual culprit</text>
  <text x="670" y="310" text-anchor="middle" font-size="11" fill="#b91c1c">One search can return more</text>
  <text x="670" y="325" text-anchor="middle" font-size="11" fill="#b91c1c">tokens than the whole chat</text>
  <text x="670" y="340" text-anchor="middle" font-size="11" fill="#b91c1c">before it.</text>

  <line x1="516" y1="165" x2="566" y2="165" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#cearr)"/>
  <rect x="572" y="127" width="196" height="76" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="670" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Easy to miss</text>
  <text x="670" y="167" text-anchor="middle" font-size="11" fill="#a16207">Tool descriptions are sent</text>
  <text x="670" y="182" text-anchor="middle" font-size="11" fill="#a16207">every turn, used or not.</text>
  <text x="670" y="197" text-anchor="middle" font-size="11" fill="#a16207">20 tools = a standing tax.</text>

  <text x="400" y="368" text-anchor="middle" font-size="12" fill="#64748b">Space one type takes is space the others cannot have — that is the whole problem.</text>
</svg>
