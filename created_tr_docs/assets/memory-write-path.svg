<svg viewBox="0 0 780 150" width="100%" style="max-width:780px;height:auto;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Write path: raw interaction, extract, structure, store, consolidate">
  <title>The write path</title>
  <defs><marker id="aw" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
    <path d="M0,0 L7,3.2 L0,6.4 z" fill="#94a3b8"/></marker></defs>
  <text x="390" y="24" text-anchor="middle" font-size="13" fill="#64748b">How a memory gets created</text>
  <rect x="5" y="46" width="130" height="52" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="70" y="77" text-anchor="middle" font-size="13.5" font-weight="600" fill="#334155">Raw interaction</text>
  <text x="70" y="120" text-anchor="middle" font-size="11.5" fill="#64748b">what the user</text>
  <text x="70" y="135" text-anchor="middle" font-size="11.5" fill="#64748b">actually said</text>
  <rect x="165" y="46" width="130" height="52" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="230" y="77" text-anchor="middle" font-size="13.5" font-weight="600" fill="#334155">Extract</text>
  <text x="230" y="120" text-anchor="middle" font-size="11.5" fill="#64748b">keep preferences,</text>
  <text x="230" y="135" text-anchor="middle" font-size="11.5" fill="#64748b">decisions, corrections</text>
  <rect x="325" y="46" width="130" height="52" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="390" y="77" text-anchor="middle" font-size="13.5" font-weight="600" fill="#334155">Structure</text>
  <text x="390" y="120" text-anchor="middle" font-size="11.5" fill="#64748b">attach the user</text>
  <text x="390" y="135" text-anchor="middle" font-size="11.5" fill="#64748b">and a timestamp</text>
  <rect x="485" y="46" width="130" height="52" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="550" y="77" text-anchor="middle" font-size="13.5" font-weight="600" fill="#334155">Store</text>
  <text x="550" y="120" text-anchor="middle" font-size="11.5" fill="#64748b">put it under</text>
  <text x="550" y="135" text-anchor="middle" font-size="11.5" fill="#64748b">a namespace</text>
  <rect x="645" y="46" width="130" height="52" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="710" y="77" text-anchor="middle" font-size="13.5" font-weight="600" fill="#334155">Consolidate</text>
  <text x="710" y="120" text-anchor="middle" font-size="11.5" fill="#64748b">merge with what</text>
  <text x="710" y="135" text-anchor="middle" font-size="11.5" fill="#64748b">is already there</text>
  <line x1="139" y1="72" x2="166" y2="72" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#aw)"/>
  <line x1="299" y1="72" x2="326" y2="72" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#aw)"/>
  <line x1="459" y1="72" x2="486" y2="72" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#aw)"/>
  <line x1="619" y1="72" x2="646" y2="72" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#aw)"/>
</svg>