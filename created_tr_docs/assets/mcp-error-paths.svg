<svg viewBox="0 0 760 300" width="100%" style="max-width:760px;height:auto;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A failing tool call can return a result with isError true which the model sees, or a JSON-RPC protocol error which only the client sees">
  <title>The two error paths</title>
  <defs><marker id="e1" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#94a3b8"/></marker></defs>
  <rect x="16" y="118" width="132" height="52" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="82" y="141" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">tools/call</text>
  <text x="82" y="158" text-anchor="middle" font-size="11" fill="#64748b">something fails</text>
  <path d="M152 134 L196 84" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#e1)"/>
  <path d="M152 154 L196 214" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#e1)"/>
  <rect x="204" y="34" width="268" height="76" rx="9" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="338" y="57" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">result with isError: true</text>
  <text x="338" y="76" text-anchor="middle" font-size="11" fill="#047857">the tool ran; the work failed</text>
  <text x="338" y="95" text-anchor="middle" font-size="11" fill="#047857">message travels as text content</text>
  <rect x="204" y="188" width="268" height="76" rx="9" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="338" y="211" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">JSON-RPC error</text>
  <text x="338" y="230" text-anchor="middle" font-size="11" fill="#b91c1c">the call itself was invalid</text>
  <text x="338" y="249" text-anchor="middle" font-size="11" fill="#b91c1c">e.g. resource not found &#8594; -32602</text>
  <line x1="478" y1="72" x2="524" y2="72" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#e1)"/>
  <line x1="478" y1="226" x2="524" y2="226" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#e1)"/>
  <rect x="532" y="46" width="212" height="52" rx="9" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="638" y="69" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">The model sees it</text>
  <text x="638" y="86" text-anchor="middle" font-size="11" fill="#047857">it can retry or explain</text>
  <rect x="532" y="200" width="212" height="52" rx="9" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="638" y="223" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">Only the client sees it</text>
  <text x="638" y="240" text-anchor="middle" font-size="11" fill="#b91c1c">the model never learns why</text>
  <text x="380" y="290" text-anchor="middle" font-size="12" fill="#64748b">Choose deliberately: an error the model cannot see is an error it cannot recover from</text>
</svg>
