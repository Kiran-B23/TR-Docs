<svg viewBox="0 0 740 250" width="100%" style="max-width:740px;height:auto;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="An MCP host creates one client per server; one client connects to your local SkillMap server over stdio, another to a remote server over HTTP">
  <title>Host, client and server</title>
  <defs><marker id="h1" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#94a3b8"/></marker></defs>
  <rect x="14" y="34" width="270" height="186" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="149" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">MCP Host</text>
  <text x="149" y="57" text-anchor="middle" font-size="11.5" fill="#64748b">your LangChain agent, Claude Code, an IDE</text>
  <rect x="36" y="78" width="226" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="149" y="106" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">MCP Client 1</text>
  <rect x="36" y="146" width="226" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="149" y="174" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">MCP Client 2</text>
  <rect x="430" y="70" width="292" height="62" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="576" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">Your SkillMap server</text>
  <text x="576" y="113" text-anchor="middle" font-size="11.5" fill="#4f46e5">local &#183; stdio &#183; you build this</text>
  <rect x="430" y="152" width="292" height="58" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="576" y="175" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">Someone else&#8217;s server</text>
  <text x="576" y="193" text-anchor="middle" font-size="11.5" fill="#64748b">remote &#183; Streamable HTTP</text>
  <line x1="266" y1="101" x2="422" y2="101" stroke="#6366f1" stroke-width="1.8" marker-end="url(#h1)"/>
  <line x1="266" y1="169" x2="422" y2="180" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#h1)"/>
  <text x="344" y="94" text-anchor="middle" font-size="10.5" fill="#4f46e5">dedicated connection</text>
  <text x="370" y="240" text-anchor="middle" font-size="12" fill="#64748b">One client per server &#183; the host cannot tell yours apart from theirs</text>
</svg>
